<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hiệu ứng máy đánh chữ</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
      background: #101522;
      color: #f4f7ff;
      font-family: system-ui, sans-serif;
    }

    .typing {
      max-width: 100%;
      overflow: hidden;
      border-right: 3px solid #7c9cff;
      color: #a9bcff;
      font-family: "Courier New", monospace;
      font-size: clamp(1.25rem, 5vw, 2.5rem);
      font-weight: 700;
      white-space: nowrap;
      width: 0;
      animation:
        typing 3s steps(25, end) forwards,
        cursor-blink 0.7s step-end infinite;
    }

    @keyframes typing {
      from {
        width: 0;
      }
      to {
        width: 25ch;
      }
    }

    @keyframes cursor-blink {
      50% {
        border-color: transparent;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing {
        width: 25ch;
        animation: none;
      }
    }
  </style>
</head>
<body>
  <h1 class="typing">Hello, CSS typing effect!</h1>
</body>
</html>
